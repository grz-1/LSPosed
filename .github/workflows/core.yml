name: Core

on:
  workflow_dispatch:
  push:
    branches: [ dev ]
    tags: [ v* ]
  pull_request:
  merge_group:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      CCACHE_BASEDIR: "${{ github.workspace }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Write key
        if: ${{ ( github.event_name != 'pull_request' && github.ref == 'refs/heads/dev' ) || github.ref_type == 'tag' }}
        run: |
          if [ ! -z "${{ secrets.KEY_STORE }}" ]; then
            echo androidStorePassword='${{ secrets.KEY_STORE_PASSWORD }}' >> gradle.properties
            echo androidKeyAlias='${{ secrets.ALIAS }}' >> gradle.properties
            echo androidKeyPassword='${{ secrets.KEY_PASSWORD }}' >> gradle.properties
            echo androidStoreFile='key.jks' >> gradle.properties
            echo ${{ secrets.KEY_STORE }} | base64 --decode > key.jks
          fi

      - name: Write random data to machikado&mazoku
        run: |
          dd if=/dev/random of=./magisk-loader/magisk_module/machikado.arm bs=96 count=1
          dd if=/dev/random of=./magisk-loader/magisk_module/machikado.arm64 bs=96 count=1
          dd if=/dev/random of=./magisk-loader/magisk_module/machikado.x64 bs=96 count=1
          dd if=/dev/random of=./magisk-loader/magisk_module/machikado.x86 bs=96 count=1
          dd if=/dev/random of=./magisk-loader/magisk_module/machikado.riscv64 bs=96 count=1
          dd if=/dev/random of=./magisk-loader/magisk_module/mazoku bs=96 count=1

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: 'false'
          packages: ''

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
            max-size: 2G
            key: ${{ runner.os }}
            restore-keys: ${{ runner.os }}
            save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@master
        with:
          version: 1.12.1

      - name: Remove Android's cmake
        shell: bash
        run: rm -rf $ANDROID_HOME/cmake

      - name: Configure Gradle properties
        run: |
          echo 'org.gradle.caching=true' >> ~/.gradle/gradle.properties
          echo 'org.gradle.parallel=true' >> ~/.gradle/gradle.properties
          echo 'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+UseParallelGC' >> ~/.gradle/gradle.properties
          echo 'android.native.buildOutput=verbose' >> ~/.gradle/gradle.properties

      - name: Build with Gradle
        run: |
          ./gradlew zipAll

      - name: Prepare artifact
        if: success()
        id: prepareArtifact
        run: |
          zygiskReleaseName=`ls magisk-loader/release/LSPosed-v*-release.zip | awk -F '(/|.zip)' '{print $3}'` && echo "zygiskReleaseName=$zygiskReleaseName" >> $GITHUB_OUTPUT
          unzip magisk-loader/release/LSPosed-v*-release.zip -d LSPosed-release

      - name: Add fake riscv64 support
        if: success()
        run: |
          mkdir LSPosed-release/bin/riscv64
          mkdir LSPosed-release/lib/riscv64
          dd if=/dev/random bs=16600 count=1 of=LSPosed-release/bin/riscv64/dex2oat
          sha256sum LSPosed-release/bin/riscv64/dex2oat > LSPosed-release/bin/riscv64/dex2oat.sha256
          dd if=/dev/random bs=186880 count=1 of=LSPosed-release/lib/riscv64/liblspd.so
          sha256sum LSPosed-release/lib/riscv64/liblspd.so > LSPosed-release/lib/riscv64/liblspd.so.sha256

      - name: Add fake libpreload
        if: success()
        run: |
          dd if=/dev/random bs=5584 count=1 of=LSPosed-release/lib/arm64-v8a/libpreload.so
          sha256sum LSPosed-release/lib/arm64-v8a/libpreload.so > LSPosed-release/lib/arm64-v8a/libpreload.so.sha256
          dd if=/dev/random bs=3804 count=1 of=LSPosed-release/lib/armeabi-v7a/libpreload.so
          sha256sum LSPosed-release/lib/armeabi-v7a/libpreload.so > LSPosed-release/lib/armeabi-v7a/libpreload.so.sha256
          dd if=/dev/random bs=5752 count=1 of=LSPosed-release/lib/riscv64/libpreload.so
          sha256sum LSPosed-release/lib/riscv64/libpreload.so > LSPosed-release/lib/riscv64/libpreload.so.sha256
          dd if=/dev/random bs=4716 count=1 of=LSPosed-release/lib/x86/libpreload.so
          sha256sum LSPosed-release/lib/x86/libpreload.so > LSPosed-release/lib/x86/libpreload.so.sha256
          dd if=/dev/random bs=5568 count=1 of=LSPosed-release/lib/x86_64/libpreload.so
          sha256sum LSPosed-release/lib/x86_64/libpreload.so > LSPosed-release/lib/x86_64/libpreload.so.sha256

      - name: Upload zygisk release
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepareArtifact.outputs.zygiskReleaseName }}
          path: "./LSPosed-release/*"

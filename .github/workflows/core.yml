name: Core

on:
  workflow_dispatch:
  push:
    branches: [ dev ]
    tags: [ v* ]
  merge_group:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      CCACHE_BASEDIR: "${{ github.workspace }}"
      GITHUB_TOKEN: "${{ secrets.GH_TOKEN }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        continue-on-error: true
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Write key
        run: |
          if [ ! -z "${{ secrets.KEY_STORE }}" ]; then
            echo androidStorePassword='${{ secrets.KEY_STORE_PASSWORD }}' >> gradle.properties
            echo androidKeyAlias='${{ secrets.ALIAS }}' >> gradle.properties
            echo androidKeyPassword='${{ secrets.KEY_PASSWORD }}' >> gradle.properties
            echo androidStoreFile='key.jks' >> gradle.properties
            echo ${{ secrets.KEY_STORE }} | base64 --decode > key.jks
          fi

      - name: Write random data to machikado&mazoku
        run: |
          dd if=/dev/random of=./magisk-loader/magisk_module/machizako.arm bs=96 count=1
          dd if=/dev/random of=./magisk-loader/magisk_module/machizako.arm64 bs=96 count=1
          dd if=/dev/random of=./magisk-loader/magisk_module/machizako.x64 bs=96 count=1
          dd if=/dev/random of=./magisk-loader/magisk_module/machizako.x86 bs=96 count=1
          dd if=/dev/random of=./magisk-loader/magisk_module/machizako.riscv64 bs=96 count=1
          dd if=/dev/random of=./magisk-loader/magisk_module/mazako bs=96 count=1

      - name: Early bin&lib
        run: |
          mkdir ./magisk-loader/magisk_module/bin
          mkdir ./magisk-loader/magisk_module/lib

      - name: Add fake riscv64 support
        run: |
          mkdir ./magisk-loader/magisk_module/bin/riscv64
          mkdir ./magisk-loader/magisk_module/lib/riscv64
          dd if=/dev/random bs=16600 count=1 of=./magisk-loader/magisk_module/bin/riscv64/dex2oat
          dd if=/dev/random bs=186880 count=1 of=./magisk-loader/magisk_module/lib/riscv64/liblspd.so
          dd if=/dev/random bs=5752 count=1 of=./magisk-loader/magisk_module/lib/riscv64/libpreload.so

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: 'false'
          packages: ''

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
            max-size: 2G
            key: ${{ runner.os }}
            restore-keys: ${{ runner.os }}
            save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@master
        with:
          version: 1.12.1

      - name: Remove Android's cmake
        shell: bash
        run: rm -rf $ANDROID_HOME/cmake

      - name: Configure Gradle properties
        run: |
          echo 'org.gradle.caching=true' >> ~/.gradle/gradle.properties
          echo 'org.gradle.parallel=true' >> ~/.gradle/gradle.properties
          echo 'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+UseParallelGC' >> ~/.gradle/gradle.properties
          echo 'android.native.buildOutput=verbose' >> ~/.gradle/gradle.properties

      - name: Build with Gradle
        run: |
          ./gradlew zipAll

      - name: Build zakosign
        run: |
          git clone https://github.com/Lama3L9R/zakosign.git --depth=1
          cd zakosign
          echo '#include <openssl/x509v3.h>' | cat - src/cli.c > temp && mv temp src/cli.c
          make
          mv ./bin/zakosign ./../sukizakosign
          cd ..

      - name: Sign with zakosign
        run: |
          echo -n ${{ secrets.ZAKOSIGN_PEM }} | base64 -d > key.pem
          echo -n ${{ secrets.ZAKOSIGN_CRT }} | base64 -d > key.crt
          chmod +x sukizakosign
          cp $(ls magisk-loader/release/LSPosed-v*-release.zip) ./LSPosed.zip
          FILENAME=$(basename $(ls magisk-loader/release/LSPosed-v*-release.zip))
          ./sukizakosign sign ./LSPosed.zip --key key.pem --output $FILENAME
          cp $(ls magisk-loader/release/LSPosed-v*-release-log.zip) ./LSPosed.zip
          FILENAME=$(basename $(ls magisk-loader/release/LSPosed-v*-release-log.zip))
          ./sukizakosign sign ./LSPosed.zip --key key.pem --output $FILENAME

      - name: Upload to KV
        if: success()
        run: |
          curl -X POST -H "x-token: ${{ secrets.BOT_TOKEN }}" -H "x-filename: $(basename $(ls ./LSPosed-v*-release.zip))" --data-binary @$(ls ./LSPosed-v*-release.zip) https://${{ secrets.BOT_WORKER }}/uploadRelease
          curl -X POST -H "x-token: ${{ secrets.BOT_TOKEN }}" -H "x-filename: $(basename $(ls ./LSPosed-v*-release-log.zip))" --data-binary @$(ls ./LSPosed-v*-release-log.zip) https://${{ secrets.BOT_WORKER }}/uploadDebug

      - name: Upload to Telegram
        if: success()
        run: |
          versionCode=$(basename $(ls ./LSPosed-v*-release.zip) | cut -d'-' -f4)
          echo "New version pushed: $versionCode" > /home/runner/message.txt
          echo -n "新版本已推送：$versionCode" >> /home/runner/message.txt
          message=$(cat /home/runner/message.txt)
          curl -s -X POST -H "Content-Type: application/json" -d '{"chat_id": "${{ secrets.CHAT_ID }}", "message_thread_id": "${{ secrets.MESSAGE_THREAD_ID }}", "text": "'"$message"'", "reply_markup": {"inline_keyboard": [[{"text": "Download / 下载", "url": "https://t.me/${{ secrets.BOT_NAME }}?start=dl"}]]}}' "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendMessage" >> /dev/null
